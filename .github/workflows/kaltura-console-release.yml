name: Kaltura Console build and release
on:
  push:
    branches: ['**']
    tags: ['kaltura-console/v*']
    paths: ['kaltura-console/**', '.github/workflows/kaltura-console-release.yml']
  pull_request:
    paths: ['kaltura-console/**', '.github/workflows/kaltura-console-release.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: kaltura-console
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: kaltura-console/go.mod
          cache-dependency-path: kaltura-console/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: kaltura-console/frontend/package-lock.json
      - run: make frontend
      - name: Go lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
          working-directory: kaltura-console
      - run: cd frontend && npm run lint && npm test
      - run: CGO_ENABLED=0 go test ./...
      - run: go test -race ./...
      - name: Install packager
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
      - name: Build packages
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            VERSION="${REF_NAME#kaltura-console/v}"
          else
            VERSION="0.1.0-dev"
          fi
          make package VERSION="$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: kaltura-console-linux-amd64
          path: kaltura-console/dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/kaltura-console/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: kaltura-console-linux-amd64
          path: dist
      - name: Publish tagged release
        uses: softprops/action-gh-release@v2
        with:
          body_path: kaltura-console/CHANGELOG.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
