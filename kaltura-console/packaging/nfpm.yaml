name: kaltura-console
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Nilton Oliveira <jniltinho@gmail.com>
description: Kaltura media console with embedded Vue frontend
homepage: https://github.com/jniltinho/platform-install-packages
license: AGPL-3.0
contents:
  - src: ./bin/kaltura-console
    dst: /usr/bin/kaltura-console
    file_info:
      mode: 0755
  - src: ./config.toml.example
    dst: /etc/kaltura-console/config.toml
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: kaltura-console
  - src: ./init/systemd/kaltura-console.service
    dst: /usr/lib/systemd/system/kaltura-console.service
    file_info:
      mode: 0644
  - dst: /var/lib/kaltura-console
    type: dir
    file_info:
      mode: 0750
      owner: kaltura-console
      group: kaltura-console
  - dst: /var/lib/kaltura-console/tmp
    type: dir
    file_info:
      mode: 0750
      owner: kaltura-console
      group: kaltura-console
  - src: ./README.md
    dst: /usr/share/doc/kaltura-console/README.md
  - src: ./CHANGELOG.md
    dst: /usr/share/doc/kaltura-console/CHANGELOG.md
scripts:
  preinstall: ./packaging/scripts/preinstall.sh
  postinstall: ./packaging/scripts/postinstall.sh
  preremove: ./packaging/scripts/preremove.sh
  postremove: ./packaging/scripts/postremove.sh
