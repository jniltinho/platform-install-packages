        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default"/>
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis"/>
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security"/>
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed"/>
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)"/>

        <!-- Boundaries (behind everything) -->
        <rect x="440" y="50" width="210" height="470" rx="12" class="c-region" stroke-width="1"/>
        <text x="448" y="68" class="t-cloud" font-size="9" font-weight="600">Console process and local state</text>

        <!-- Connection paths (before components for correct z-order) -->
        <path d="M 160 290 L 250 290" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 370 290 L 470 290" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 620 290 L 760 290" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
        <path d="M 545 260 L 545 140" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <path d="M 545 320 L 545 440" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>

        <!-- Components -->
        <rect x="40" y="260" width="120" height="60" rx="6" class="c-mask"/>
        <rect x="40" y="260" width="120" height="60" rx="6" class="c-frontend" stroke-width="1.5"/>
        <text x="100" y="288" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Browser</text>
        <text x="100" y="304" class="t-muted" font-size="9" text-anchor="middle">Vue + Tailwind</text>

        <rect x="250" y="260" width="120" height="60" rx="6" class="c-mask"/>
        <rect x="250" y="260" width="120" height="60" rx="6" class="c-security" stroke-width="1.5"/>
        <text x="310" y="288" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">HTTPS edge</text>
        <text x="310" y="304" class="t-muted" font-size="9" text-anchor="middle">optional proxy</text>

        <rect x="470" y="260" width="150" height="60" rx="6" class="c-mask"/>
        <rect x="470" y="260" width="150" height="60" rx="6" class="c-backend" stroke-width="1.5"/>
        <text x="545" y="288" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Go / Echo v5</text>
        <text x="545" y="304" class="t-muted" font-size="9" text-anchor="middle">API + embedded UI</text>

        <rect x="760" y="260" width="155" height="60" rx="6" class="c-mask"/>
        <rect x="760" y="260" width="155" height="60" rx="6" class="c-external" stroke-width="1.5"/>
        <text x="837.5" y="288" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Kaltura 18.20</text>
        <text x="837.5" y="304" class="t-muted" font-size="9" text-anchor="middle">API + media delivery</text>

        <rect x="470" y="80" width="150" height="60" rx="6" class="c-mask"/>
        <rect x="470" y="80" width="150" height="60" rx="6" class="c-database" stroke-width="1.5"/>
        <text x="545" y="108" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Console database</text>
        <text x="545" y="124" class="t-muted" font-size="9" text-anchor="middle">SQLite OR MariaDB</text>

        <rect x="470" y="440" width="150" height="60" rx="6" class="c-mask"/>
        <rect x="470" y="440" width="150" height="60" rx="6" class="c-database" stroke-width="1.5"/>
        <text x="545" y="468" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">Private staging</text>
        <text x="545" y="484" class="t-muted" font-size="9" text-anchor="middle">bounded disk uploads</text>

