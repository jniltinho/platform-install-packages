<svg viewBox="0 0 955 588" role="img" aria-label="Kaltura Console — One executable; one partner; separate console state (architecture diagram)" width="955" height="588" xmlns="http://www.w3.org/2000/svg"><style>@font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: local('JetBrains Mono'), local('JetBrainsMono-Regular'); }
